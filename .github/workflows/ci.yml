name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: predictions_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run unit + integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/predictions_test
          DATABASE_ADMIN_URL: postgresql://admin:adminpassword@localhost:5432/predictions_test
          ASSIGNMENT_SALT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SERVER_SIGNING_SEED: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          NODE_ENV: test

      - name: DB privilege probe
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/predictions_test
          DATABASE_ADMIN_URL: postgresql://admin:adminpassword@localhost:5432/predictions_test
          ASSIGNMENT_SALT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SERVER_SIGNING_SEED: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          NODE_ENV: test
